[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tickytickertextual"
version = "0.1.0"
description = "A read-only, ranger-style filesystem navigator for the terminal and web"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "textual>=6,<9",
    "textual-serve>=1.1.3,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
tickytickertextual = "tickytickertextual.app:main"
tickytickertextual-web = "tickytickertextual.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tickytickertextual = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

