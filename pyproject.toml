[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tickytickertextual"
version = "0.1.0"
description = "A read-only, ranger-style filesystem navigator for the terminal and web"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2,<3",
    "tickyticker>=0.1,<0.2",
    "textual>=6,<9",
    "textual-serve>=1.1.3,<2",
]

[tool.uv.sources]
tickyticker = { git = "https://github.com/MatteoLacki/tickyticker.git", rev = "c67651a3615e4fe513b19aeb13138046a731899f" }

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
tickytickertextual = "tickytickertextual.app:main"
tickytickertextual-web = "tickytickertextual.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tickytickertextual = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
