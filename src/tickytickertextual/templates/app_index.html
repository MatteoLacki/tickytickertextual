<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="{{ config.static.url }}css/xterm.css" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Roboto%20Mono"
    />
    <script>
      (() => {
        const NativeWebSocket = window.WebSocket;
        let appSocket = null;

        window.WebSocket = new Proxy(NativeWebSocket, {
          construct(target, args) {
            const socket = new target(...args);
            socket.addEventListener('message', event => {
              if (typeof event.data !== 'string') return;
              let message;
              try { message = JSON.parse(event.data); } catch (_) { return; }
              if (message[0] !== 'open_url' || !message[1].url.startsWith('/plots/')) return;
              event.stopImmediatePropagation();
              const url = message[1].url;
              if (url.includes('download=1')) {
                const link = document.createElement('a');
                link.href = url; link.download = ''; link.click();
              } else if (window.pendingPlotWindow && !window.pendingPlotWindow.closed) {
                window.pendingPlotWindow.location.href = url;
                window.pendingPlotWindow = null;
              } else {
                const viewer = window.open(url, '_blank');
                if (!viewer) {
                  const link = document.getElementById('plot-link');
                  link.href = url; link.hidden = false;
                  exportStatus('Click Open plot');
                }
              }
            });
            if (String(args[0]).includes("/ws")) {
              appSocket = socket;
              // Textual may send focus/resize before its WebSocket opens.
              const send = socket.send.bind(socket);
              socket.send = (data) => {
                if (socket.readyState === NativeWebSocket.CONNECTING) {
                  socket.addEventListener('open', () => send(data), {once:true});
                } else if (socket.readyState === NativeWebSocket.OPEN) {
                  send(data);
                }
              };
            }
            return socket;
          },
        });

        window.addEventListener(
          "keydown",
          (event) => {
            if (
              event.ctrlKey &&
              !event.altKey &&
              !event.metaKey &&
              event.key === "."
            ) {
              event.preventDefault();
              event.stopImmediatePropagation();
              if (
                !event.repeat &&
                appSocket &&
                appSocket.readyState === NativeWebSocket.OPEN
              ) {
                appSocket.send(JSON.stringify(["stdin", "\u001b[46;5u"]));
              }
            }
          },
          true,
        );

        const focusTerminal = () => {
          const textarea = document.querySelector(
            "#terminal .xterm-helper-textarea",
          );
          if (!textarea) {
            return false;
          }
          textarea.focus({ preventScroll: true });
          return true;
        };
        window.focusTerminal = focusTerminal;

        window.addEventListener("DOMContentLoaded", () => {
          if (focusTerminal()) {
            return;
          }
          const observer = new MutationObserver(() => {
            if (focusTerminal()) {
              observer.disconnect();
            }
          });
          observer.observe(document.documentElement, {
            childList: true,
            subtree: true,
          });
        });
      })();
    </script>
    <script src="{{ config.static.url }}js/textual.js"></script>
    <style>
      body {
        background: #0c181f;
      }

      .dialog-container {
        position: absolute;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
        box-shadow: var(--shadow-elevation-high);
      }
      .shade {
        position: absolute;
        width: 100%;
        height: 100%;
        background: #0c181f;
        background-image: url("{{ config.static.url }}images/background.png");
      }
      .intro {
        width: 640px;
        height: 240px;
        font-size: 16px;
        z-index: 20;
        font-family: "Roboto Mono", menlo, monospace;
        text-align: center;
        opacity: 1;
        color: rgba(255, 255, 255, 0.95);
        background-color: #12232d;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 32px;
      }

      body.-first-byte .intro-dialog,
      body.-first-byte .intro-dialog .shade {
        opacity: 0;
        transition: opacity 0.3s ease-out;
        display: none;
      }

      body .textual-terminal {
        opacity: 0;
        transition: opacity 0.3s ease-out;
      }

      body.-first-byte .textual-terminal {
        opacity: 1;
        transition: opacity 0.3s ease-out;
      }

      .intro svg {
        padding-right: 16px;
      }

      body Button {
        padding: 16px 32px;
        background-color: #5e0ba7;
        color: rgba(255, 255, 255, 0.95);
        border: none;
        font-family: "Roboto Mono", menlo, monospace;
        margin: 16px;
        display: block;
      }

      Button:hover {
        background: #ac5af4;
        cursor: pointer;
      }

      .closed-dialog {
        opacity: 0;
        display: none;
      }

      body.-closed .closed-dialog {
        opacity: 1;
        display: flex;
      }

      #start {
        display: none;
      }

      #start.-delay {
        display: flex;
      }

      #session-controls {
        position: fixed; left: 8px; bottom: 0; z-index: 50;
        display: flex; align-items: center; height: 40px;
        color: #ff7b72; background: #0c181f; font: 12px monospace;
      }
      #session-controls button {
        margin: 0 8px 0 0; padding: 6px 12px; font: inherit;
        background: #161b22; border: 1px solid #ff7b72;
      }

      #export-toolbar {
        position: fixed;
        left: 150px;
        right: 8px;
        bottom: 0;
        z-index: 40;
        display: none;
        gap: 6px;
        align-items: center;
        padding: 4px 6px;
        color: #c9d1d9;
        background: rgba(13, 17, 23, 0.92);
        border: 1px solid #30363d;
        font: 12px "Roboto Mono", menlo, monospace;
      }

      body.-first-byte #export-toolbar {
        display: flex;
      }

      #export-toolbar button {
        display: inline-block;
        margin: 0;
        padding: 4px 8px;
        color: #c9d1d9;
        background: #161b22;
        border: 1px solid #ff7b72;
        font: inherit;
      }

      #export-toolbar button:hover {
        cursor: pointer;
        background: #1f6feb;
      }

      #terminal { height: calc(100vh - 42px); }
      #export-toolbar { overflow-x: auto; white-space: nowrap; }
      #export-toolbar button:enabled { color: #ff7b72; }
      #export-toolbar button:disabled { color: #777; border-color: #555; cursor: default; }
      body.-closed #export-toolbar { display: none; }

      #export-status {
        min-width: 5em;
        color: #8be9fd;
      }
    </style>
    <script>
      function getStartUrl() {
        const url = new URL(window.location.href);
        const params = new URLSearchParams(url.search);
        params.delete("delay");
        return url.pathname + "?" + params.toString();
      }
      async function restartApp() {
        const button = document.getElementById('restart-app');
        const status = document.getElementById('restart-status');
        button.disabled = true;
        status.textContent = 'Restarting…';
        try {
          const response = await fetch('/restart', {
            method: 'POST',
            headers: {'X-Restart-Token': document.body.dataset.restartToken},
          });
          if (!response.ok) throw new Error('Restart failed; try again');
          window.location.replace(getStartUrl());
        } catch (error) {
          status.textContent = error.message;
          button.disabled = false;
        }
      }
      async function refresh() {
        const ping_url = document.body.dataset.pingurl;
        if (ping_url) {
          await fetch(ping_url, {
            method: "GET",
            mode: "no-cors",
          });
        }
        window.location.href = getStartUrl();
      }

      function exportStatus(message, error = false) {
        const status = document.getElementById("export-status");
        status.textContent = message;
        status.style.color = error ? "#ff7b72" : "#8be9fd";
      }

      async function runAppAction(action) {
        if (action === 'chromatograms') {
          window.pendingPlotWindow = window.open('about:blank', '_blank');
          if (window.pendingPlotWindow) window.pendingPlotWindow.document.body.textContent = 'Loading chromatograms…';
        }
        try {
          const response = await fetch('/action', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-Restart-Token': document.body.dataset.restartToken},
            body: JSON.stringify({action}),
          });
          if (!response.ok) throw new Error('Action unavailable; try again');
          focusTerminal();
        } catch (error) {
          if (window.pendingPlotWindow) window.pendingPlotWindow.close();
          window.pendingPlotWindow = null;
          exportStatus(error.message, true);
        }
      }
      async function updateExportButtons() {
        let state = {ready: false, actions: {}};
        try {
          const response = await fetch('/exports/status', {cache:'no-store'});
          if (response.ok) state = await response.json();
        } catch (_) {}
        document.querySelectorAll('#export-toolbar button[data-export]').forEach(button => button.disabled = !state.ready);
        document.querySelectorAll('#export-toolbar button[data-action]').forEach(button => {
          button.disabled = !state.actions?.[button.dataset.action];
        });
      }
      window.addEventListener('DOMContentLoaded', () => {
        updateExportButtons(); setInterval(updateExportButtons, 1000);
      });

      async function copySelectedTable() {
        try {
          const response = await fetch(`/exports/selected.tsv?t=${Date.now()}`, {
            cache: "no-store",
          });
          if (!response.ok) throw new Error("table is not ready");
          const text = await response.text();
          let copied = false;
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            copied = true;
          } else {
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            copied = document.execCommand("copy");
            textarea.remove();
          }
          if (!copied) throw new Error("browser blocked clipboard access");
          exportStatus("copied");
          focusTerminal();
        } catch (error) {
          exportStatus(error.message, true);
        }
      }

      function downloadExport(filename) {
        const link = document.createElement("a");
        link.href = `/exports/${filename}?t=${Date.now()}`;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        exportStatus("download");
        focusTerminal();
      }
    </script>
  </head>
  <body data-pingurl="{{ ping_url }}" data-restart-token="{{ restart_token }}">
    <div id="session-controls">
      <button type="button" id="restart-app" onclick="restartApp()"
        title="Clear selections and results, stop calculations, and start a fresh session">Restart app</button>
      <span id="restart-status" role="status"></span>
    </div>
    <div id="export-toolbar">
      <button type="button" disabled data-action="chromatograms" onclick="runAppAction('chromatograms')">See Chromatograms</button>
      <button type="button" disabled data-action="rerun" onclick="runAppAction('rerun')">Rerun</button>
      <button type="button" disabled data-action="tic-new" onclick="runAppAction('tic-new')">TIC new folders</button>
      <button type="button" disabled data-export onclick="copySelectedTable()">Copy table</button>
      <button type="button" disabled data-export onclick="downloadExport('selected.csv')">Save table</button>
      <button type="button" disabled data-export onclick="downloadExport('raw-tics.csv')">Raw TIC CSV</button>
      <span id="export-status"></span>
      <a id="plot-link" hidden target="_blank" rel="noopener">Open plot</a>
    </div>
    <div class="dialog-container intro-dialog">
      <div class="shade"></div>
      <div class="intro">
        <svg
          width="32px"
          viewBox="0 0 2933 2261"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            fill-rule="evenodd"
            clip-rule="evenodd"
            d="M2927.81 0H1677.1L1312.35 205.173H306.689L0.359375 434.921L204.029 893.177H735.972L644.784 2261H1060.36L1441.72 1974.97L2073.92 688.003H2334.4L2717.9 472.286L2927.81 0ZM1245.82 410.347L1276.32 277.656H330.85L153.929 410.347H1245.82ZM1229.16 482.83H100.972L251.134 820.694H813.449L722.26 2188.52H837.043L1229.16 482.83ZM1350.7 277.656L911.417 2188.52H1023.87L1662.19 615.52H2301.36L2451.52 277.656H1350.7ZM1460.19 205.173H2497.79L2733.69 72.4829H1696.09L1460.19 205.173Z"
            fill="#ffffff"
          />
        </svg>

        <div>{{ application.name or 'Textual Application' }}</div>
        <button type="button" onClick="refresh()" id="start">Start</button>
      </div>
    </div>

    <div class="dialog-container closed-dialog">
      <div class="shade"></div>
      <div class="intro">
        <div class="message">Session ended.</div>
        <button type="button" onClick="restartApp()">Restart</button>
      </div>
    </div>

    <div
      id="terminal"
      class="textual-terminal"
      data-session-websocket-url="{{ app_websocket_url }}"
      data-font-size="{{ font_size }}"
    ></div>
  </body>
</html>
